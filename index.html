<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>امیر زیبائی | Amir Zibaei</title>
<meta name="theme-color" content="#050508"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Vazirmatn','system-ui','sans-serif']},colors:{surface:{950:'#050508',900:'#0a0a10',800:'#111118',700:'#1a1a24'},accent:{DEFAULT:'#7c6aff',soft:'#a78bfa'}}}}}</script>
<style>
*{box-sizing:border-box}html{scroll-behavior:auto}
body{background:#050508;color:#e4e4e7;overflow-x:hidden;cursor:none;font-family:Vazirmatn,system-ui,sans-serif}
@media(max-width:768px){body{cursor:auto}.cursor,.cursor-ring{display:none!important}}
.cursor{position:fixed;top:0;left:0;width:12px;height:12px;background:#a78bfa;border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}
.cursor-ring{position:fixed;top:0;left:0;width:36px;height:36px;border:1.5px solid rgba(167,139,250,.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s}
.cursor.hover,.cursor-ring.hover{width:56px;height:56px}
.cursor.hover{background:rgba(167,139,250,.25);mix-blend-mode:normal}
.cursor-ring.hover{border-color:#a78bfa}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(99,102,241,.18),transparent),radial-gradient(ellipse 60% 40% at 90% 10%,rgba(168,85,247,.12),transparent),radial-gradient(ellipse 50% 30% at 50% 100%,rgba(59,130,246,.08),transparent)}
#pc{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.45}
.content{position:relative;z-index:2}
.noise{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.gt{background:linear-gradient(135deg,#c4b5fd,#a78bfa 35%,#67e8f9 70%,#818cf8);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gs 8s ease infinite}
@keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.glass{background:rgba(17,17,24,.55);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.07)}
.glass-s{background:rgba(17,17,24,.75);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.09)}
.card3d{transform-style:preserve-3d;transition:box-shadow .3s}
.card3d:hover{box-shadow:0 25px 50px -12px rgba(124,106,255,.25)}
.mag{transition:transform .25s cubic-bezier(.25,.46,.45,.94)}
.nl{position:relative;transition:color .25s}
.nl::after{content:'';position:absolute;bottom:-3px;right:0;width:0;height:2px;background:linear-gradient(90deg,#a78bfa,#67e8f9);transition:width .35s;border-radius:2px}
.nl:hover::after,.nl.active::after{width:100%}
.sbar{height:4px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.sfill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#a78bfa,#67e8f9);background-size:200% 100%;animation:sh 2.5s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.btn-g{position:relative;overflow:hidden}
.btn-g::before{content:'';position:absolute;inset:-2px;background:linear-gradient(135deg,#7c6aff,#a78bfa,#67e8f9,#7c6aff);background-size:300% 300%;border-radius:inherit;z-index:-1;animation:bg 4s linear infinite;opacity:.7}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.sl{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:#a78bfa;font-weight:500}
.mw{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mt{display:flex;width:max-content;animation:mq 35s linear infinite}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(50%)}}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;pointer-events:none}
.la{width:48px;height:3px;background:linear-gradient(90deg,#7c6aff,transparent);border-radius:2px}
</style>
</head>
<body>
<div class="cursor" id="c"></div><div class="cursor-ring" id="cr"></div>
<div class="bg-mesh"></div><canvas id="pc"></canvas><div class="noise"></div>
<div class="content">
<!-- FULL SITE CONTENT - see local file for complete version; deploying via Vercel next -->
<p style="padding:4rem;text-align:center;color:#a78bfa">در حال به‌روزرسانی… لطفاً چند ثانیه صبر کنید و رفرش کنید.</p>
</div>
</body>
</html>
